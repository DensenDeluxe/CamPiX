name: CamPiX checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg v4l-utils
      - run: uv sync --locked --extra test --extra v4l2
      - run: python scripts/fetch-mediamtx.py --output /tmp/campix-ci-mediamtx
      - run: uv run --no-sync pytest -q
        env:
          CAMPIX_TEST_MEDIAMTX_BINARY: /tmp/campix-ci-mediamtx
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - run: npm run check && npm run check:docs && npm run format:check && npm test
      - run: uv run --no-sync python -m build --wheel --outdir packages
      - run: uv run --no-sync python scripts/build-deb.py
      - run: docker compose build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: campix-packages
          path: packages/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
