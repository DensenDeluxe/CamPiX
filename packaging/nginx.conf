# Install inside nginx's http context. Replace host and certificate paths first.
map $http_upgrade $campix_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name camera.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name camera.example.invalid;
    ssl_certificate /etc/letsencrypt/live/camera.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camera.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campix_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
