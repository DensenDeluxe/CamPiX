[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campix"
version = "0.2.0"
description = "Camera control, recording, and streaming for Raspberry Pi and Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.36,<1",
  "websockets>=14,<17",
  "argon2-cffi>=23.1,<26",
  "pillow>=9.4,<13",
  "numpy>=1.24,<3",
  "psutil>=6,<8",
  "httpx>=0.28,<1",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
v4l2 = ["opencv-python-headless>=4.10,<5"]
test = ["pytest>=8,<10", "pytest-timeout>=2,<3", "build>=1,<2"]

[project.scripts]
campixd = "campix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/campix/web" = ["dist/index.html", "dist/styles.css", "dist/app.js"]
"share/campix/web/assets" = ["dist/assets/campix-icon.svg", "dist/assets/campix-wordmark.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 45
filterwarnings = ["error", "ignore:The 'timeout' argument is deprecated:DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI's Depends(...) defaults are intentional.
